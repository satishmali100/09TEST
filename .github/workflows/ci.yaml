name: Terraform CI - Non Prod

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform-ci:
    name: Terraform Validate & Plan

    # Your Windows self-hosted runner
    runs-on: [self-hosted, windows, x64]

    defaults:
      run:
        shell: powershell
        working-directory: ./Environments/non-prod

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Verify Terraform files
      - name: Verify Terraform Configuration
        run: |
          Write-Host "Working directory:"
          Get-Location

          Write-Host ""
          Write-Host "Terraform files:"
          Get-ChildItem -Force

          Write-Host ""
          Write-Host "Checking terraform.tfvars..."

          if (-not (Test-Path ".\terraform.tfvars")) {
              throw "terraform.tfvars not found"
          }

          Write-Host "terraform.tfvars found"

      # 5. Terraform Init
      - name: Terraform Init
        run: |
          terraform init -input=false -no-color

      # 6. Terraform Format Check
      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      # 7. Terraform Validate
      - name: Terraform Validate
        run: |
          terraform validate

      # 8. Terraform Plan
      - name: Terraform Plan
        run: |
          terraform plan `
            -var-file="terraform.tfvars" `
            -input=false `
            -no-color
