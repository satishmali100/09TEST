name: Terraform CI - Non Prod

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform-ci:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Environments/non-prod

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create terraform.tfvars
        env:
          TFVARS: ${{ secrets.TFVARS_NON_PROD }}
        run: |
          printf '%s\n' "$TFVARS" > terraform.tfvars

      - name: Verify Terraform Configuration
        run: |
          echo "Working directory:"
          pwd

          echo ""
          echo "Terraform files:"
          ls -la

          echo ""
          echo "Checking terraform.tfvars..."
          test -s terraform.tfvars

          echo "terraform.tfvars created successfully"

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -no-color

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -input=false \
            -no-color
